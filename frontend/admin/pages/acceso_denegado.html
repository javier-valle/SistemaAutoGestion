<!DOCTYPE html>
<html lang="es">
<head>
        <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGestion - Acceso denegado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/redesign.css">
    <link rel="stylesheet" href="/css/polish.css?v=20261005">
    <link rel="stylesheet" href="/css/panels-premium.css?v=20261002">
    <script>
        (function(){var t=localStorage.getItem('ag-theme')||'system';if(t==='system')t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t);})();
    </script>
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .denegado-card {
            max-width: 520px; width: 100%; text-align: center;
            background: var(--ag-surface, var(--bs-body-bg));
            border: 1px solid var(--ag-border, rgba(128,128,128,.25));
            border-radius: 20px; padding: 48px 36px;
            box-shadow: 0 24px 60px rgba(0,0,0,.18);
            animation: ag-fade-up .35s ease both;
        }
        .denegado-icon {
            width: 84px; height: 84px; margin: 0 auto 20px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(239, 68, 68, .12); color: #ef4444;
        }
        .denegado-icon svg { width: 42px; height: 42px; }
        .denegado-code {
            font-family: 'Space Grotesk', sans-serif; font-weight: 700;
            font-size: 13px; letter-spacing: .2em; color: #ef4444;
            text-transform: uppercase; margin-bottom: 8px;
        }
        .denegado-title { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; margin: 0 0 10px; }
        .denegado-msg { opacity: .75; line-height: 1.6; margin: 0 0 8px; }
        .denegado-rol {
            display: inline-flex; align-items: center; gap: 8px;
            margin: 16px 0 28px; padding: 8px 16px; border-radius: 999px;
            border: 1px solid var(--ag-border, rgba(128,128,128,.25));
            font-size: 13px; font-weight: 600; opacity: .9;
        }
        .denegado-rol .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; }
        .denegado-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .denegado-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 22px; border-radius: 12px; border: 1px solid transparent;
            font-weight: 600; font-size: 14px; cursor: pointer;
            text-decoration: none; transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
        }
        .denegado-btn:hover { transform: translateY(-2px); }
        .denegado-btn-primary {
            background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff;
            box-shadow: 0 10px 24px rgba(239, 68, 68, .3);
        }
        .denegado-btn-ghost {
            background: transparent; color: inherit;
            border-color: var(--ag-border, rgba(128,128,128,.35));
        }
        @media (prefers-reduced-motion: reduce) { .denegado-card { animation: none; } }
    </style>
</head>
<body>
    <div class="denegado-card" role="alert">
        <div class="denegado-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div class="denegado-code">Error 403</div>
        <h1 class="denegado-title">Acceso denegado</h1>
        <p class="denegado-msg">Tu rol no tiene permisos para ver este modulo del taller. Si crees que es un error, consulta con el administrador.</p>
        <div id="rolChip" class="denegado-rol"><span class="dot"></span> Sesión: <strong id="rolNombre">...</strong></div>
        <div class="denegado-actions">
            <a id="btnInicio" class="denegado-btn denegado-btn-primary" href="../index.html">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Ir a mi panel
            </a>
            <a id="btnLogout" class="denegado-btn denegado-btn-ghost" href="../index.html">Cerrar sesion</a>
        </div>
    </div>

    <script>
        
        if (!localStorage.getItem('token')) {
            window.location.replace('../index.html');
        }

        const ROLE_LABELS = { ADMIN: 'Administrador', MECANICO: 'Mecanico', RECEPCIONISTA: 'Recepcionista', ALMACENERO: 'Almacenero' };

        let rol = null;
        try { rol = JSON.parse(localStorage.getItem('user') || 'null')?.rol || null; } catch (_) { rol = null; }

        
        const home = typeof homePageForRol === 'function' && rol
            ? homePageForRol(rol)
            : 'dashboard.html';
        document.getElementById('btnInicio').href = home;
        document.getElementById('rolNombre').textContent = ROLE_LABELS[rol] || rol || 'desconocido';
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
        });
    </script>
</body>
</html>
