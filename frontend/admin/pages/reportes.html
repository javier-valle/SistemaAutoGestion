<html lang="es">
<head>
        <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        (function(){var t=localStorage.getItem('ag-theme')||'system';if(t==='system')t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t);})();
    </script>
    <style>
        .ag-chart { width:100%; height:180px; }
        .ag-chart text { font-size:9px; fill:var(--ag-text-muted); font-family:var(--ag-font-heading); }
        .ag-leer { background:var(--ag-oil-surface); border:1px solid var(--ag-oil-border); border-radius:var(--ag-radius); padding:0.7rem 0.9rem; font-size:0.8rem; color:var(--ag-text-mid); margin-bottom:1rem; }
        .ag-leer b { color:var(--ag-oil-text); }
        .ag-formula { font-family:var(--ag-font-mono, monospace); background:var(--ag-ground); border:1px dashed var(--ag-border); border-radius:8px; padding:0.7rem 1rem; font-size:0.82rem; margin-bottom:1rem; }
        @media print {
            body > *:not(#printAreaRep) { display:none !important; }
            #printAreaRep { display:block !important; }
        }
        #printAreaRep { display:none; }
    </style>
</head>
<body>
    <div id="navbar"></div>
    <div class="ag-page">
        <div class="ag-head">
            <div class="ag-head-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><rect x="6.6" y="13" width="3.2" height="7" rx="1.2"/><rect x="11" y="9" width="3.2" height="11" rx="1.2" fill="currentColor" stroke="none" opacity=".3"/><rect x="11" y="9" width="3.2" height="11" rx="1.2"/><rect x="15.4" y="5" width="3.2" height="15" rx="1.2"/></svg>
            </div>
            <div class="ag-head-titles">
                <h1>Reportes</h1>
                <p>Números del taller con fecha, gráfico y tabla — todo exportable</p>
            </div>
        </div>
        <div id="alertContainer"></div>
        <div class="ag-section ag-mb-3">
            <div class="ag-section-body">
                <div class="ag-d-flex ag-align-center ag-gap-3 ag-flex-wrap">
                    <div class="ag-d-flex ag-gap-3">
                        <button class="ag-btn ag-btn-outline ag-btn-sm" onclick="rangoRapido('hoy')">Hoy</button>
                        <button class="ag-btn ag-btn-outline ag-btn-sm" onclick="rangoRapido('semana')">7 días</button>
                        <button class="ag-btn ag-btn-outline ag-btn-sm" onclick="rangoRapido('mes')">Mes</button>
                        <button class="ag-btn ag-btn-outline ag-btn-sm" onclick="rangoRapido('mesAnt')">Mes anterior</button>
                    </div>
                    <input class="ag-form-control" id="fDesde" type="date" style="width:auto;" onchange="cargarTabActiva()">
                    <input class="ag-form-control" id="fHasta" type="date" style="width:auto;" onchange="cargarTabActiva()">
                    <span class="ag-text-muted ag-text-sm">Zona America/Lima</span>
                    <span style="flex:1"></span>
                    <button class="ag-btn ag-btn-outline ag-btn-sm" onclick="openExportModal()" title="Generar PDF o Excel con los reportes que elijas">Exportar consolidado</button>
                    <button class="ag-btn ag-btn-primary ag-btn-sm" onclick="exportarPDF()" title="Documento plano listo para imprimir / guardar como PDF">PDF / Imprimir</button>
                </div>
            </div>
        </div>
        <div class="ag-tabs" role="tablist" id="repTabs"></div>
        <div id="repBody"></div>
        <div id="printAreaRep"></div>

        
        <div id="exportModal" style="display:none;position:fixed;inset:0;background:rgba(6,17,30,0.55);z-index:200;align-items:center;justify-content:center;" onclick="if(event.target===this)closeExportModal()">
            <div style="background:var(--ag-oil-surface);border:1px solid var(--ag-oil-border);border-radius:16px;padding:2rem;width:520px;max-width:92vw;box-shadow:0 24px 64px rgba(0,0,0,0.35);max-height:88vh;overflow:auto;">
                <div class="ag-d-flex ag-justify-between ag-align-center ag-mb-3">
                    <h2 style="font-size:1.1rem;margin:0;">Exportar reporte consolidado</h2>
                    <button onclick="closeExportModal()" style="background:none;border:none;font-size:1.2rem;color:var(--ag-text-muted);cursor:pointer;">×</button>
                </div>
                <p class="ag-text-sm ag-text-muted ag-mb-3">Selecciona los reportes que deseas incluir y el formato de salida.</p>
                <div id="exportChecks" class="ag-mb-3" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.5rem;"></div>
                <div class="ag-mb-3">
                    <label class="ag-form-label" style="font-size:0.8rem;margin-bottom:0.3rem;display:block;">Formato</label>
                    <div class="ag-d-flex ag-gap-2">
                        <label style="flex:1;"><input type="radio" name="fmtExp" value="pdf" checked> PDF</label>
                        <label style="flex:1;"><input type="radio" name="fmtExp" value="excel"> Excel</label>
                    </div>
                </div>
                <div class="ag-form-group ag-mb-3">
                    <label class="ag-form-label">Vista previa</label>
                    <div id="exportPreview" style="background:var(--ag-ground);border:1px dashed var(--ag-border);border-radius:8px;padding:0.7rem;font-size:0.82rem;color:var(--ag-text-mid);min-height:48px;">
                        Selecciona los reportes y un formato para ver el resumen.
                    </div>
                </div>
                <div class="ag-d-flex ag-justify-end ag-gap-2">
                    <button class="ag-btn ag-btn-outline ag-btn-sm" onclick="closeExportModal()">Cancelar</button>
                    <button class="ag-btn ag-btn-primary ag-btn-sm" onclick="ejecutarExportacion()">Generar y descargar</button>
                </div>
            </div>
        </div>
    </div>
    <div id="themeToggleWrap"></div>
    <script src="/js/api.js?v=20261006"></script>
    <script src="/js/animations.js?v=20261005"></script>
    <script src="/js/ui-kit.js?v=20261005"></script>
    <script src="/js/reportes/api-reportes.js?v=1"></script>
    <script src="/js/reportes/charts.js?v=1"></script>
    <script src="/js/reportes/tablas.js?v=1"></script>
    <script>
        if (!guardPage('reportes')) throw new Error('Acceso denegado');
        document.getElementById('navbar').innerHTML = renderNavbar('reportes');
        document.getElementById('themeToggleWrap').innerHTML = renderThemeToggle();
        initTheme();
        const ROL = getUser().rol;
        const TABS = [
            { id: 'resumen', label: 'Resumen', roles: ['ADMIN'] },
            { id: 'clientes', label: 'Clientes', roles: ['ADMIN', 'RECEPCIONISTA'] },
            { id: 'ingresos', label: 'Ingresos', roles: ['ADMIN'] },
            { id: 'inventario', label: 'Inventario', roles: ['ADMIN', 'ALMACENERO'] },
            { id: 'gastos', label: 'Gastos', roles: ['ADMIN'] },
            { id: 'resultado', label: 'Resultado', roles: ['ADMIN'] },
            { id: 'mecanicos', label: 'Mecánicos', roles: ['ADMIN'] }
        ].filter(t => t.roles.includes(ROL));
        let tabActiva = TABS[0].id;
        let cache = {};

        function rangoQS() {
            const d = document.getElementById('fDesde').value;
            const h = document.getElementById('fHasta').value;
            return `desde=${d}&hasta=${h}`;
        }
        function rangoRapido(cual) {
            const hoy = new Date();
            const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            let d, h;
            if (cual === 'hoy') { d = h = hoy; }
            else if (cual === 'semana') { d = new Date(hoy); d.setDate(d.getDate() - 6); h = hoy; }
            else if (cual === 'mesAnt') { d = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1); h = new Date(hoy.getFullYear(), hoy.getMonth(), 0); }
            else { d = new Date(hoy.getFullYear(), hoy.getMonth(), 1); h = hoy; }
            document.getElementById('fDesde').value = fmt(d);
            document.getElementById('fHasta').value = fmt(h);
            cargarTabActiva();
        }
        function pintarTabs() {
            document.getElementById('repTabs').innerHTML = TABS.map(t =>
                `<button class="ag-tab ${t.id === tabActiva ? 'active' : ''}" onclick="cambiarRepTab('${t.id}')">${t.label}</button>`).join('');
        }
        function cambiarRepTab(id) { tabActiva = id; pintarTabs(); cargarTabActiva(); }
        function cargarTabActiva() {
            ({ resumen: tabResumen, clientes: tabClientes, ingresos: tabIngresos, inventario: tabInventario,
               gastos: tabGastos, resultado: tabResultado, mecanicos: tabMecanicos })[tabActiva]();
        }
        function kpi(icon, valor, etiqueta) {
            return `<div class="ag-indicator"><div class="ag-indicator-icon ${icon}">${iconSvg(icon)}</div>
                <div><div class="ag-indicator-value">${valor}</div><div class="ag-indicator-label">${etiqueta}</div></div></div>`;
        }
        function iconSvg(k) {
            const m = {
                'ic-blue': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.3V12l3.2 2"/></svg>',
                'ic-amber': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="7" width="18.4" height="11" rx="2.5" fill="currentColor" stroke="none" opacity=".22"/><rect x="2.8" y="7" width="18.4" height="11" rx="2.5"/><circle cx="12" cy="12.5" r="2.6"/><path d="M6.3 10.3h.01M17.7 14.7h.01"/></svg>',
                'ic-green': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" fill="currentColor" stroke="none" opacity=".22"/><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.4 2.4 4.6-5.2"/></svg>',
                'ic-red': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8L2.6 19.5h18.8z" fill="currentColor" stroke="none" opacity=".25"/><path d="M12 3.8L2.6 19.5h18.8L12 3.8z"/><path d="M12 9.8v4.2M12 17v.01"/></svg>'
            };
            return m[k] || m['ic-blue'];
        }
        
        function svgBars(el, labels, values, color) {
            const W = 560, H = 180, pad = 28;
            const max = Math.max(1, ...values);
            const n = values.length;
            const bw = n ? Math.min(46, (W - pad * 2) / n * 0.6) : 0;
            let s = `<svg class="ag-chart" viewBox="0 0 ${W} ${H}" role="img">`;
            for (let g = 0; g <= 3; g++) {
                const y = pad + (H - pad * 2) * g / 3;
                s += `<line x1="${pad}" y1="${y}" x2="${W - 8}" y2="${y}" stroke="var(--ag-border)" stroke-width="1"/>`;
            }
            values.forEach((v, i) => {
                const h = (H - pad * 2) * v / max;
                const x = pad + ((W - pad * 2) / n) * i + ((W - pad * 2) / n - bw) / 2;
                const y = H - pad - h;
                s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${color}"><title>${labels[i]}: ${v}</title></rect>`;
                if (n <= 14) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${(H - 10).toFixed(1)}" text-anchor="middle" font-size="7">${esc(String(labels[i] || '').slice(0, 14))}</text>`;
            });
            document.getElementById(el).innerHTML = s + '</svg>';
        }
        function leer(t) { return `<div class="ag-leer"><b>¿Cómo leer este reporte?</b> ${t}</div>`; }
        function tabla(heads, rows, csv) {
            const id = 'tbl' + Math.random().toString(36).slice(2, 8);
            window[id] = csv;
            return `<div class="ag-table-wrap"><table class="ag-table"><thead><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                <tbody>${rows || '<tr><td colspan="9" class="ag-text-center ag-text-muted">Sin datos en este rango</td></tr>'}</tbody></table></div>
                ${csv ? `<div class="ag-d-flex ag-gap-3 ag-mt-2"><button class="ag-btn ag-btn-outline ag-btn-sm" onclick="descargarCSV('${id}')">Exportar CSV</button><button class="ag-btn ag-btn-outline ag-btn-sm" onclick="imprimirTabla('${id}')">PDF</button></div>` : ''}`;
        }
        function tituloCsv(t) {
            return String(t ?? '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }
        function celdaCsv(v) {
            if (v === null || v === undefined) return '';
            if (typeof v === 'number' && Number.isFinite(v)) {
                return Number.isInteger(v) ? String(v) : v.toFixed(2).replace('.', ',');
            }
            let s = String(v).replace(/\r?\n/g, ' ').trim();
            if (/^[a-z][a-z0-9_]*$/.test(s)) s = tituloCsv(s);
            return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }
        function csvDescargar(nombre, filas) {
            if (!Array.isArray(filas) || !filas.length) return;
            const csv = filas.map(r => r.map(celdaCsv).join(';')).join('\r\n');
            const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = nombre;
            a.rel = 'noopener';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { try { a.remove(); URL.revokeObjectURL(url); } catch (_) {  } }, 1200);
        }
        window.descargarCSV = function(id) {
            const { nombre, filas } = window[id];
            csvDescargar(nombre, filas);
            toast('CSV descargado', 'success');
        };
        

        const PRINT_CSS = `
            @page{size:A4 landscape;margin:11mm}
            *{box-sizing:border-box}
            body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#1f2937;margin:0;padding:16px 20px;font-size:11px}
            .doc-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #b45309;padding-bottom:10px;margin-bottom:14px}
            .doc-brand{font-size:21px;font-weight:700;letter-spacing:-.5px;color:#16233a}
            .doc-brand b{color:#b45309}
            .doc-sub{font-size:10px;color:#64748b;margin-top:3px}
            .doc-meta{text-align:right;font-size:9px;color:#64748b;line-height:1.65}
            h1{font-size:15px;margin:0 0 3px;color:#16233a}
            h3{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#b45309;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid #e2e8f0}
            table{width:100%;border-collapse:collapse;font-size:9.5px;margin:0 0 12px}
            thead{display:table-header-group}
            th{background:#16233a;color:#fff;font-weight:600;text-align:left;padding:7px 8px;border:1px solid #16233a;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em}
            td{padding:6px 8px;border-bottom:1px solid #e2e8f0;vertical-align:top}
            tbody tr:nth-child(even) td{background:#fbf7f2}
            tfoot td{font-weight:700;border-top:2px solid #b45309}
            .kpi{display:inline-block;border:1px solid #e2e8f0;border-left:3px solid #b45309;border-radius:6px;padding:8px 12px;margin:0 8px 8px 0;font-size:10px;min-width:140px}
            .ag-leer,.ag-formula{border:1px solid #e2e8f0;border-left:3px solid #16233a;background:#f8fafc;border-radius:6px;padding:8px 12px;font-size:9.5px;margin-bottom:10px}
            .ag-indicator{display:inline-block;border:1px solid #e2e8f0;border-radius:8px;padding:8px 14px;margin:0 8px 8px 0}
            .ag-indicator-icon,.ag-chart,button,.ag-btn,svg,.ag-table-actions{display:none!important}
            .doc-foot{margin-top:16px;border-top:1px solid #e2e8f0;padding-top:6px;font-size:8px;color:#94a3b8;display:flex;justify-content:space-between}
            th,tbody tr:nth-child(even) td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
        `;
        function docHead(subtitulo) {
            const desde = document.getElementById('fDesde').value || '—';
            const hasta = document.getElementById('fHasta').value || '—';
            return `<div class="doc-head"><div><div class="doc-brand">Auto<b>Gestion</b></div>
                <div class="doc-sub">Sistema de gestion para taller automotriz</div></div>
                <div class="doc-meta"><b style="color:#16233a;font-size:11px;">${esc(subtitulo)}</b><br>
                Del ${esc(desde)} al ${esc(hasta)} · Zona America/Lima<br>
                Generado ${esc(new Date().toLocaleString('es-PE'))} · Rol ${esc(ROL)}</div></div>`;
        }
        function docFoot() {
            return `<div class="doc-foot"><span>AutoGestion · Documento generado automaticamente</span><span>${esc(new Date().toLocaleString('es-PE'))}</span></div>`;
        }
        window.imprimirTabla = function(id) {
            const data = window[id];
            if (!data) return;
            const { filas } = data;
            const [head, ...body] = filas;
            const tabLabel = (TABS.find(t => t.id === tabActiva) || {}).label || tabActiva;
            const w = window.open('', '_blank', 'width=1000,height=760');
            if (!w) { toast('Permite ventanas emergentes para generar el PDF', 'warning'); return; }
            w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>AutoGestion - ${esc(tabLabel)}</title>
                <style>${PRINT_CSS}</style></head><body>
                ${docHead('Reporte de ' + tabLabel)}
                <h3>Detalle</h3>
                <table><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
                <tbody>${body.map(r => `<tr>${r.map(c => `<td>${esc(c ?? '')}</td>`).join('')}</tr>`).join('') || '<tr><td>Sin datos</td></tr>'}</tbody></table>
                ${docFoot()}
                <script>window.onload=function(){window.print();}<\/script></body></html>`);
            w.document.close();
        };
        
        window.exportarPDF = function() {
            const tabLabel = (TABS.find(t => t.id === tabActiva) || {}).label || tabActiva;
            const desde = document.getElementById('fDesde').value || '—';
            const hasta = document.getElementById('fHasta').value || '—';
            const host = document.getElementById('repBody');
            if (!host || !host.innerHTML.trim()) { toast('Nada que imprimir todavía', 'warning'); return; }
            
            const clon = host.cloneNode(true);
            clon.querySelectorAll('button, .ag-btn, .ag-chart, svg, .ag-indicator-icon').forEach(n => n.remove());
            const w = window.open('', '_blank', 'width=1000,height=800');
            if (!w) { toast('Permite ventanas emergentes para generar el PDF', 'warning'); return; }
            w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>AutoGestion - ${esc(tabLabel)}</title>
                <style>${PRINT_CSS}</style></head><body>
                ${docHead('Reporte de ' + tabLabel)}
                ${clon.innerHTML}
                ${docFoot()}
                <script>window.onload=function(){window.print();}<\/script></body></html>`);
            w.document.close();
            toast('Abriendo vista de impresión (guarda como PDF)', 'success');
        };
        


        window.exportarClientesPorDia = async function () {
            try {
                await apiDescargar(`/reportes/clientes-por-dia/export?${rangoQS()}&formato=csv`, 'clientes-por-dia.csv');
                toast('CSV descargado', 'success');
            } catch (e) { toast('No se pudo exportar: ' + e.message, 'danger'); }
        };
        

        window.exportarGeneralCSV = async function() {
            const qs = rangoQS();
            const desde = document.getElementById('fDesde').value || '';
            const hasta = document.getElementById('fHasta').value || '';
            const sec = (t) => [[`[${t}]`]];
            try {
                toast('Armando CSV general...', 'info', 2000);
                if (tabActiva === 'resumen') {
                    const [ind, cli, comp, inv, res] = await Promise.all([
                        apiFetch('/reportes/indicadores'),
                        apiFetch(`/reportes/clientes-por-dia?${qs}`),
                        apiFetch(`/reportes/comprobantes-resumen?${qs}`),
                        apiFetch(`/reportes/inventario/resumen?${qs}`),
                        apiFetch(`/reportes/resultado?${qs}`)]);
                    csvDescargar(`resumen-general_${desde}_${hasta}.csv`, [
                        ['reporte', 'resumen'], ['rango_desde', desde], ['rango_hasta', hasta],
                        ...sec('INDICADORES'), ['ot_completadas_mes', ind.otCompletadasMes], ['ingresos_mes', ind.ingresosMes], ['bajo_stock', ind.productosBajoStock],
                        ...sec('CLIENTES_POR_DIA'), ['dia', 'atendidos', 'recepciones', 'entregas'], ...cli.map(d => [d.dia, d.clientesAtendidos, d.recepciones, d.entregas]),
                        ...sec('COMPROBANTES'), ['tipo', 'cantidad', 'gravado', 'igv', 'total'], ...comp.map(c => [c.tipo, c.cantidad, c.gravado, c.igv, c.total]),
                        ...sec('RESULTADO'), ['ingresos', res.ingresos], ['sin_igv', res.ingresosSinIgv], ['compras', res.compras], ['consumido', res.costoConsumido], ['gastos', res.gastosOperativos], ['utilidad', res.utilidadEstimada]]);
                } else if (tabActiva === 'clientes') {
                    const [dias, estados, recepciones, clientes] = await Promise.all([
                        apiFetch(`/reportes/clientes-por-dia?${qs}`),
                        apiFetch('/reportes/recepciones-por-estado'),
                        apiFetch('/recepciones').catch(() => []),
                        apiFetch('/clientes').catch(() => [])]);
                    const carros = (recepciones || []).filter(r => (!desde || String(r.fechaIngreso || '').slice(0, 10) >= desde) && (!hasta || String(r.fechaIngreso || '').slice(0, 10) <= hasta));

                    <p><b>${k.productoNombre || ''}</b> · Saldo inicial: <b>${k.saldoInicial}</b> · Saldo final: <b>${k.saldoFinal}</b></p>
                    ${tabla(['Fecha', 'Tipo', 'Cant.', 'Costo', 'Doc', 'Proveedor', 'Quién', 'Saldo'],
                        k.movimientos.map(m => `<tr><td class="ag-text-sm">${formatDate(m.fecha)}</td><td>${m.tipo}</td><td class="col-num">${m.cantidad}</td><td class="col-num">${m.costoUnitario != null ? formatCurrency(m.costoUnitario) : '—'}</td><td class="ag-text-sm">${m.documento || '—'}</td><td class="ag-text-sm">${m.proveedor || '—'}</td><td class="ag-text-sm">${m.usuario || '—'}</td><td class="col-num ag-fw-700">${m.saldo}</td></tr>`).join(''),
                        { nombre: 'kardex.csv', filas: [['fecha', 'tipo', 'cantidad', 'costo', 'documento', 'saldo'], ...k.movimientos.map(m => [m.fecha, m.tipo, m.cantidad, m.costoUnitario, m.documento, m.saldo])] })}`;
            } catch (e) { toast('Error: ' + e.message, 'danger'); }
        }

        
        async function tabGastos() {
            B.innerHTML = '<p class="ag-text-muted">Cargando...</p>';
            try {
                const [grupos, lista, provs] = await Promise.all([
                    apiFetch(`/reportes/gastos?${rangoQS()}`),
                    apiFetch(`/gastos?${rangoQS()}&page=0&size=15&sort=fecha,desc`),
                    apiFetch('/proveedores').catch(() => [])
                ]);
                const tot = grupos.reduce((a, g) => a + g.total, 0);
                B.innerHTML = `
                    ${leer('Alquiler, luz, sueldos y demás gastos que no son repuestos. Se registran aquí mismo.')}
                    <div class="ag-grid ag-grid-2 ag-mb-3">
                        <div class="ag-section"><div class="ag-section-header"><h3>Registrar gasto · Total: ${formatCurrency(tot)}</h3></div>
                            <div class="ag-section-body">
                                <div class="ag-grid ag-grid-2">
                                    <div class="ag-form-group" style="margin:0;"><label class="ag-form-label">Fecha</label><input class="ag-form-control" id="gFecha" type="date"></div>
                                    <div class="ag-form-group" style="margin:0;"><label class="ag-form-label">Categoría</label>
                                        <select class="ag-form-control" id="gCat"><option>ALQUILER</option><option>SERVICIOS</option><option>SUELDOS</option><option>HERRAMIENTAS</option><option>LIMPIEZA</option><option>TRANSPORTE</option><option>OTROS</option></select></div>
                                </div>
                                <div class="ag-form-group"><label class="ag-form-label">Descripción *</label><input class="ag-form-control" id="gDesc" placeholder="Ej. Alquiler del local - octubre"></div>
                                <div class="ag-grid ag-grid-2">
                                    <div class="ag-form-group" style="margin:0;"><label class="ag-form-label">Monto (S/) *</label><input class="ag-form-control" id="gMonto" type="number" step="0.01" placeholder="0.00"></div>
                                    <div class="ag-form-group" style="margin:0;"><label class="ag-form-label">Proveedor (opcional)</label>
                                        <select class="ag-form-control" id="gProv"><option value="">-- Ninguno --</option>${(provs || []).map(p => `<option value="${p.id}">${p.nombre}</option>`).join('')}</select></div>
                                </div>
                                <div class="ag-form-group"><label class="ag-form-label">Documento ref.</label><input class="ag-form-control" id="gDoc" placeholder="Ej. Recibo 001"></div>
                                <button class="ag-btn ag-btn-success" onclick="registrarGasto()">Registrar gasto</button>
                                <p class="ag-field-error" id="gError" hidden></p>
                            </div></div>
                        <div class="ag-section"><div class="ag-section-header"><h3>Por categoría</h3></div><div class="ag-section-body"><div id="chGas"></div>
                            ${tabla(['Categoría', 'Veces', 'Total'],
                                grupos.map(g => `<tr><td>${g.etiqueta}</td><td class="col-num">${g.cantidad}</td><td class="col-num">${formatCurrency(g.total)}</td></tr>`).join(''),
                                { nombre: 'gastos.csv', filas: [['categoria', 'veces', 'total'], ...grupos.map(g => [g.categoria, g.cantidad, g.total])] })}
                        </div></div>
                    </div>
                    <div class="ag-section"><div class="ag-section-header"><h3>Últimos gastos</h3></div><div class="ag-section-body">
                        ${tabla(['Fecha', 'Categoría', 'Descripción', 'Monto', 'Quién'],
                            (lista.content || []).map(g => `<tr><td class="ag-text-sm">${g.fecha}</td><td>${g.categoriaEtiqueta}</td><td>${g.descripcion}</td><td class="col-num">${formatCurrency(g.monto)}</td><td class="ag-text-sm">${g.registradoPorNombre || ''}</td></tr>`).join(''), null)}
                    </div></div>`;
                svgBars('chGas', grupos.map(g => g.etiqueta), grupos.map(g => g.total), '#b45309');
            } catch (e) { B.innerHTML = '<p class="ag-text-muted">Error al cargar</p>'; }
        }
        async function registrarGasto() {
            const err = document.getElementById('gError');
            const monto = parseFloat(document.getElementById('gMonto').value);
            const desc = document.getElementById('gDesc').value.trim();
            if (!desc) { err.textContent = 'Describe el gasto.'; err.hidden = false; return; }
            if (!monto || monto <= 0) { err.textContent = 'Monto mayor a 0.'; err.hidden = false; return; }
            err.hidden = true;
            try {
                await apiFetch('/gastos', { method: 'POST', body: JSON.stringify({
                    fecha: document.getElementById('gFecha').value || null,
                    categoria: document.getElementById('gCat').value,
                    descripcion: desc, monto,
                    proveedorId: document.getElementById('gProv').value ? parseInt(document.getElementById('gProv').value) : null,
                    documentoRef: document.getElementById('gDoc').value.trim() || null }) });
                toast('Gasto registrado', 'success');
                tabGastos();
            } catch (e) { err.textContent = e.message; err.hidden = false; }
        }

        
        async function tabResultado() {
            B.innerHTML = '<p class="ag-text-muted">Cargando...</p>';
            try {
                const r = await apiFetch(`/reportes/resultado?${rangoQS()}`);
                B.innerHTML = `
                    <div class="ag-formula"><span data-g="utilidad">utilidad estimada</span> = ingresos sin <span data-g="igv">IGV</span> − costo de lo consumido − gastos operativos<br>
                    = ${formatCurrency(r.ingresosSinIgv)} − ${formatCurrency(r.costoConsumido)} − ${formatCurrency(r.gastosOperativos)} = <b>${formatCurrency(r.utilidadEstimada)}</b></div>
                    ${leer('Estimación académica, <b>no es un estado financiero contable</b>: no incluye sueldos impagos, deudas ni depreciación. Solo lo registrado en el rango.')}
                    <div class="ag-grid ag-grid-3 ag-mb-3">
                        ${kpi('ic-green', formatCurrency(r.ingresos), 'Ingresos (con IGV)')}
                        ${kpi('ic-blue', formatCurrency(r.ingresosSinIgv), 'Ingresos sin IGV')}
                        ${kpi(r.utilidadEstimada >= 0 ? 'ic-green' : 'ic-red', formatCurrency(r.utilidadEstimada), 'Utilidad estimada')}
                    </div>
                    ${tabla(['Concepto', 'Monto'],
                        `<tr><td>Compras a proveedores</td><td class="col-num">${formatCurrency(r.compras)}</td></tr>
                         <tr><td>Costo de lo consumido</td><td class="col-num">${formatCurrency(r.costoConsumido)}</td></tr>
                         <tr><td>Gastos operativos</td><td class="col-num">${formatCurrency(r.gastosOperativos)}</td></tr>`,
                        { nombre: 'resultado.csv', filas: [['concepto', 'monto'], ['ingresos', r.ingresos], ['ingresos_sin_igv', r.ingresosSinIgv], ['compras', r.compras], ['costo_consumido', r.costoConsumido], ['gastos', r.gastosOperativos], ['utilidad', r.utilidadEstimada]] })}`;
            } catch (e) { B.innerHTML = '<p class="ag-text-muted">Error al cargar</p>'; }
        }

        
        async function tabMecanicos() {
            B.innerHTML = '<p class="ag-text-muted">Cargando...</p>';
            try {
                const filas = await apiFetch(`/reportes/rendimiento-mecanicos?${rangoQS()}`);
                B.innerHTML = `
                    ${leer('Asignadas = OT creadas en el rango. En proceso = abiertas hoy. Finalizadas + tiempo promedio del rango. Consumo = costo de sus repuestos. Ingresos = comprobantes de sus OT.')}
                    ${tabla(['Mecánico', 'Asignadas', 'En proceso', 'Finalizadas', 'Horas prom.', 'Consumo (S/)', 'Ingresos (S/)'],
                        filas.map(m => `<tr><td class="ag-fw-600">${m.nombre}</td><td class="col-num">${m.asignadas}</td><td class="col-num">${m.enProceso}</td><td class="col-num">${m.finalizadas}</td><td class="col-num">${m.horasPromedio ?? '—'}</td><td class="col-num">${formatCurrency(m.consumoCosto)}</td><td class="col-num">${formatCurrency(m.ingresos)}</td></tr>`).join(''),
                        { nombre: 'mecanicos.csv', filas: [['mecanico', 'asignadas', 'en_proceso', 'finalizadas', 'horas_prom', 'consumo', 'ingresos'], ...filas.map(m => [m.nombre, m.asignadas, m.enProceso, m.finalizadas, m.horasPromedio, m.consumoCosto, m.ingresos])] })}`;
            } catch (e) { B.innerHTML = '<p class="ag-text-muted">Error al cargar</p>'; }
        }

        
        const REP_NAMES = {
            resumen: 'Resumen', clientes: 'Clientes', ingresos: 'Ingresos',
            inventario: 'Inventario', gastos: 'Gastos', resultado: 'Resultado', mecanicos: 'Mecánicos'
        };
        function openExportModal() {
            const box = document.getElementById('exportChecks');
            box.innerHTML = Object.entries(REP_NAMES).map(([k, v]) =>
                `<label style="display:flex;align-items:center;gap:0.4rem;font-size:0.85rem;cursor:pointer;">
                    <input type="checkbox" name="exp_rpt" value="${k}" checked> <span>${v}</span>
                 </label>`).join('');
            document.getElementById('exportModal').style.display = 'flex';
            actualizarPreview();
        }
        function closeExportModal() { document.getElementById('exportModal').style.display = 'none'; }
        document.querySelectorAll('input[name="fmtExp"]').forEach(el => el.addEventListener('change', actualizarPreview));
        document.getElementById('exportChecks').addEventListener('change', actualizarPreview);
        function actualizarPreview() {
            const seleccionados = Array.from(document.querySelectorAll('input[name="exp_rpt"]:checked')).map(c => c.value);
            const fmt = document.querySelector('input[name="fmtExp"]:checked')?.value || 'pdf';
            const preview = document.getElementById('exportPreview');
            if (seleccionados.length === 0) {
                preview.innerHTML = '<span style="color:var(--ag-signal-stop);">Selecciona al menos un reporte.</span>';
                return;
            }
            const desde = document.getElementById('fDesde').value || '—';
            const hasta = document.getElementById('fHasta').value || '—';
            preview.innerHTML = `<b>Reportes:</b> ${seleccionados.map(s => REP_NAMES[s] || s).join(', ')}<br>` +
                `<b>Formato:</b> ${fmt.toUpperCase()}<br>` +
                `<b>Rango:</b> ${desde} al ${hasta}<br>` +
                `<span style="font-size:0.75rem;color:var(--ag-text-muted);">El archivo incluirá portada, encabezados profesionales, tablas y numeración de páginas.</span>`;
        }
        async function ejecutarExportacion() {
            const seleccionados = Array.from(document.querySelectorAll('input[name="exp_rpt"]:checked')).map(c => c.value);
            const fmt = document.querySelector('input[name="fmtExp"]:checked')?.value || 'pdf';
            const desde = document.getElementById('fDesde').value;
            const hasta = document.getElementById('fHasta').value;
            if (seleccionados.length === 0) { toast('Selecciona al menos un reporte', 'warning'); return; }
            const qs = `reportes=${seleccionados.join(',')}&formato=${fmt}${desde ? `&desde=${desde}` : ''}${hasta ? `&hasta=${hasta}` : ''}`;
            const boton = document.querySelector('#exportModal .ag-btn-primary');
            const texto = boton ? boton.textContent : '';
            if (boton) { boton.disabled = true; boton.textContent = 'Generando...'; }
            try {
                toast('Generando reporte consolidado...', 'info', 3000);
                await new Promise(r => setTimeout(r, 60));
                await apiDescargar(`/reportes/export/consolidado?${qs}`, `reporte-consolidado.${fmt === 'excel' ? 'xlsx' : fmt === 'ambos' ? 'pdf' : fmt}`);
                toast('Reporte descargado', 'success');
            } catch (e) {
                toast('Error: ' + e.message, 'danger');
            } finally {
                closeExportModal();
                if (boton) { boton.disabled = false; boton.textContent = texto || 'Generar y descargar'; }
            }
        }
        
        pintarTabs();
        rangoRapido('mes');
    </script>
</body>
</html>
