<!DOCTYPE html>
<html lang="es">
<head>
        <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGestion - Ordenes de Trabajo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css?v=20261005">
    <link rel="stylesheet" href="/css/animations.css?v=20261005">
    <link rel="stylesheet" href="/css/redesign.css?v=20261005">
    <link rel="stylesheet" href="/css/polish.css?v=20261005">
    <link rel="stylesheet" href="/css/panels-premium.css?v=20261002">
    <script>
        (function(){var t=localStorage.getItem('ag-theme')||'system';if(t==='system')t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t);})();
    </script>
</head>
<body>
    <div id="navbar"></div>
    <div class="ag-page">
        <div class="ag-head">
            <div class="ag-head-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/><circle cx="16.6" cy="7.4" r="1.4" fill="currentColor" stroke="none" opacity=".28"/></svg>
            </div>
            <div class="ag-head-titles">
                <h1>Ordenes de Trabajo</h1>
                <p>Arrastra con los botones: PENDIENTE → EN PROCESO → EN PRUEBA → FINALIZADA</p>
            </div>
            <div class="ag-head-meta">
                <input class="ag-form-control" id="otSearch" placeholder="Buscar placa, cliente o mecánico" style="width:240px;">
            </div>
        </div>
        <div id="alertContainer"></div>
        <div class="ag-section ag-mb-3" id="otCreateSection" hidden>
            <div class="ag-section-header">
                <h3>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Crear Orden de Trabajo
                </h3>
                <span class="ag-text-muted ag-text-sm">Solo desde cotización APROBADA</span>
            </div>
            <div class="ag-section-body">
                <form id="otForm" class="ag-grid ag-grid-3" style="align-items:end;">
                    <div class="ag-form-group" style="margin:0;"><label class="ag-form-label">Cotizacion Aprobada *</label><select class="ag-form-control" id="cotizacionSelect" required><option value="">-- Seleccionar --</option></select></div>
                    <div class="ag-form-group" style="margin:0;"><label class="ag-form-label">Mecanico Asignado *</label><select class="ag-form-control" id="mecanicoSelect" required><option value="">-- Cargando mecánicos... --</option></select></div>
                    <button type="submit" class="ag-btn ag-btn-primary">Crear OT</button>
                </form>
            </div>
        </div>
        <div class="ag-kanban" id="kanban"></div>
    </div>
    <div class="ag-modal-overlay" id="modalProducto">
        <div class="ag-card ag-modal">
            <div class="ag-card-header"><h3>Registrar Producto Usado</h3><button class="ag-btn ag-btn-outline ag-btn-sm" onclick="cerrarModal('modalProducto')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
            <div class="ag-card-body">
                <input type="hidden" id="otIdProducto">
                <div class="ag-form-group"><label class="ag-form-label">Producto *</label><select class="ag-form-control" id="productoSelect" required><option value="">-- Seleccionar --</option></select></div>
                <div class="ag-form-group"><label class="ag-form-label">Cantidad Usada *</label><div id="cantidadUsadaWrap"></div></div>
                <p class="ag-field-hint">Descuenta stock al instante y queda auditado como CONSUMO de esta OT.</p>
                <button class="ag-btn ag-btn-primary ag-btn-block" onclick="registrarProductoUsado()">Registrar</button>
            </div>
        </div>
    </div>
    <div class="ag-modal-overlay" id="modalReasignar">
        <div class="ag-card ag-modal">
            <div class="ag-card-header"><h3>Reasignar mecánico</h3><button class="ag-btn ag-btn-outline ag-btn-sm" onclick="cerrarModal('modalReasignar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
            <div class="ag-card-body">
                <input type="hidden" id="otIdReasignar">
                <div class="ag-form-group"><label class="ag-form-label">Nuevo mecánico *</label><select class="ag-form-control" id="reasignarSelect" required><option value="">-- Seleccionar --</option></select></div>
                <button class="ag-btn ag-btn-primary ag-btn-block" onclick="confirmarReasignar()">Reasignar</button>
            </div>
        </div>
    </div>
    <div id="themeToggleWrap"></div>
    <script src="/js/api.js?v=20261006"></script>
    <script src="/js/animations.js?v=20261005"></script>
    <script src="/js/ui-kit.js?v=20261005"></script>
    <script src="/js/confirm-modal.js?v=20261005"></script>
    <script>
        if (!guardPage('orden_trabajo')) throw new Error('Acceso denegado');
        document.getElementById('navbar').innerHTML = renderNavbar('orden_trabajo');
        document.getElementById('themeToggleWrap').innerHTML = renderThemeToggle();
        document.getElementById('cantidadUsadaWrap').innerHTML = agStepper('cantidadUsada', { value: 1, min: 1 });
        document.getElementById('cantidadUsada').setAttribute('required', '');
        initTheme();
        const user = getUser();
        const puedeCrear = user.rol === 'ADMIN' || user.rol === 'RECEPCIONISTA';
        const puedeAvanzar = user.rol === 'ADMIN' || user.rol === 'MECANICO';
        if (puedeCrear) document.getElementById('otCreateSection').hidden = false;
        let todasOT = [];
        let debounceT = null;
        function abrirModal(id) { document.getElementById(id).classList.add('show'); }
        function cerrarModal(id) { document.getElementById(id).classList.remove('show'); }
        async function loadData() {
            try {
                if (puedeCrear) {
                    const cotizaciones = await apiFetch('/cotizaciones?estado=APROBADA');
                    const sel = document.getElementById('cotizacionSelect');
                    cotizaciones.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = `Cot. #${c.id} - ${formatCurrency(c.total)}`; sel.appendChild(o); });
                }
                const productos = await apiFetch('/productos');
                const ps = document.getElementById('productoSelect');
                productos.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = `${p.nombre} (Stock: ${p.stockActual})`; ps.appendChild(o); });
                cargarMecanicos();
                loadOrdenes();
            } catch (e) { console.error(e); }
        }
        async function cargarMecanicos() {
            const sels = [document.getElementById('mecanicoSelect'), document.getElementById('reasignarSelect')].filter(Boolean);
            try {
                const mecs = (await apiFetch('/usuarios/mecanicos')).sort((a, b) => a.otActivas - b.otActivas);
                sels.forEach(sel => {
                    if (!sel) return;
                    sel.innerHTML = '<option value="">-- Seleccionar --</option>';
                    mecs.forEach((m, i) => {
                        const o = document.createElement('option');
                        o.value = m.id;
                        o.textContent = `${m.nombreCompleto} — ${m.especialidadEtiqueta || 'General'} · ${m.otActivas} OT activas${i === 0 ? ' · Sugerido' : ''}`;
                        sel.appendChild(o);
                    });
                    if (!mecs.length) sel.innerHTML = '<option value="">Sin mecánicos activos</option>';
                });
                
                sugerirMecanico();
            } catch (e) { sels.forEach(sel => { if (sel) sel.innerHTML = '<option value="">No se pudo cargar</option>'; }); }
        }
        
        async function sugerirMecanico() {
            const cotId = document.getElementById('cotizacionSelect')?.value;
            const sel = document.getElementById('mecanicoSelect');
            if (!sel || !sel.options.length) return;
            const existe = (id) => id && [...sel.options].some(o => o.value === String(id));
            try {
                if (cotId) {
                    const c = await apiFetch(`/cotizaciones/${cotId}`);
                    if (existe(c.mecanicoId)) {
                        sel.value = String(c.mecanicoId);
                        toast(`Mecánico del diagnóstico pre-asignado: ${c.mecanicoNombre}`, 'info');
                        return;
                    }
                }
            } catch (_) {  }
            try {
                const ultimo = localStorage.getItem('ag_ultimo_mecanico');
                if (ultimo && existe(ultimo) && !sel.value) sel.value = ultimo;
            } catch (_) {  }
        }
        document.getElementById('cotizacionSelect')?.addEventListener('change', sugerirMecanico);
        document.getElementById('otForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const mecId = parseInt(document.getElementById('mecanicoSelect').value);
                await apiFetch('/ordenes-trabajo/completa', { method: 'POST', body: JSON.stringify({
                    cotizacionId: parseInt(document.getElementById('cotizacionSelect').value),
                    mecanicoId: mecId
                }) });
                try { localStorage.setItem('ag_ultimo_mecanico', String(mecId)); } catch (_) {  }
                showSuccess('alertContainer', 'Orden de trabajo creada');
                document.getElementById('otForm').reset();
                loadData();
            } catch (e) { showError('alertContainer', e.message); }
        });
        const COLUMNAS = [
            { estado: 'PENDIENTE', titulo: 'Pendiente' },
            { estado: 'EN_PROCESO', titulo: 'En proceso' },
            { estado: 'EN_PRUEBA', titulo: 'En prueba' },
            { estado: 'FINALIZADA', titulo: 'Finalizada' }
        ];
        const SIG = { PENDIENTE: 'EN_PROCESO', EN_PROCESO: 'EN_PRUEBA', EN_PRUEBA: 'FINALIZADA' };
        const BTN = { PENDIENTE: 'Iniciar', EN_PROCESO: 'Pasar a prueba', EN_PRUEBA: 'Finalizar' };
        async function loadOrdenes() {
            try {
                todasOT = user.rol === 'MECANICO' ? await apiFetch(`/ordenes-trabajo/mecanico/${user.id}`) : await apiFetch('/ordenes-trabajo');
                pintarKanban();
            } catch (e) { document.getElementById('kanban').innerHTML = '<p class="ag-text-muted">Error al cargar</p>'; }
        }
        function otCoincide(ot, q) {
            if (!q) return true;
            const s = `${ot.id} ${ot.vehiculoPlaca || ''} ${ot.clienteNombre || ''} ${ot.mecanicoNombre || ''}`.toLowerCase();
            return s.includes(q);
        }
        function tarjeta(ot) {
            const puede = puedeAvanzar && SIG[ot.estado];
            return `
            <div class="ag-state-card sc-${(ot.estado || '').toLowerCase()}">
                <div class="ag-d-flex ag-justify-between ag-align-center" style="gap:0.4rem;">
                    <span class="sc-id">#${ot.id}</span>
                    <span class="sc-meta">${formatDate(ot.fechaCreacion)}</span>
                </div>
                <div class="sc-title" style="margin-top:0.3rem;">${ot.vehiculoPlaca || '-'} · ${ot.clienteNombre || '-'}</div>
                <div class="sc-meta">${ot.mecanicoNombre || '-'}</div>
                ${ot.problemaReportado ? `<p class="sc-meta" style="margin:0.25rem 0 0;">${ot.problemaReportado.slice(0, 80)}${ot.problemaReportado.length > 80 ? '…' : ''}</p>` : ''}
                <div class="ag-kanban-cardbtns">
                    ${puede ? `<button class="ag-btn ag-btn-primary ag-btn-sm" onclick="avanzarOT(${ot.id},'${SIG[ot.estado]}')">${BTN[ot.estado]}</button>` : ''}
                    ${(ot.estado === 'EN_PROCESO' || ot.estado === 'EN_PRUEBA') && puedeAvanzar ? `<button class="ag-btn ag-btn-outline ag-btn-sm" onclick="abrirModalProducto(${ot.id})">+ Repuesto</button>` : ''}
                    ${puedeCrear && ot.estado !== 'FINALIZADA' && ot.estado !== 'CANCELADA' ? `<button class="ag-btn ag-btn-outline ag-btn-sm" onclick="abrirModalReasignar(${ot.id})">Reasignar</button>` : ''}
                    ${ot.estado === 'FINALIZADA' && (user.rol === 'ADMIN' || user.rol === 'RECEPCIONISTA') ? `<a class="ag-btn ag-btn-success ag-btn-sm" href="pago_entrega.html">Cobrar →</a>` : ''}
                </div>
            </div>`;
        }
        function pintarKanban() {
            const q = (document.getElementById('otSearch').value || '').toLowerCase().trim();
            const k = document.getElementById('kanban');
            k.innerHTML = COLUMNAS.map(col => {
                const items = todasOT.filter(o => o.estado === col.estado && otCoincide(o, q));
                return `<div class="ag-kanban-col">
                    <div class="ag-kanban-colhead"><b>${col.titulo}</b><span class="ag-kanban-count">${items.length}</span></div>
                    <div class="ag-kanban-cards">${items.length ? items.map(tarjeta).join('') : '<p class="ag-text-muted ag-text-sm" style="text-align:center; padding:0.5rem;">Vacío</p>'}</div>
                </div>`;
            }).join('');
        }
        document.getElementById('otSearch').addEventListener('input', () => { clearTimeout(debounceT); debounceT = setTimeout(pintarKanban, 200); });
        async function avanzarOT(id, ne) {
            const cierra = ne === 'FINALIZADA';
            const msg = cierra
                ? `Finalizar la OT #${id}? Se habilita el cobro y la recepción pasa a FINALIZADA.`
                : `Pasar la OT #${id} a ${ne.replace(/_/g, ' ')}?`;
            if (!(await confirmarAccion(msg, { tipo: cierra ? 'danger' : 'primary' }))) return;
            try { await apiFetch(`/ordenes-trabajo/${id}/estado`, { method: 'PUT', body: JSON.stringify({ estado: ne }) }); toast(`OT #${id} → ${ne.replace(/_/g, ' ')}`, 'success'); loadOrdenes(); }
            catch (e) { toast('Error: ' + e.message, 'danger'); }
        }
        function abrirModalProducto(otId) { document.getElementById('otIdProducto').value = otId; abrirModal('modalProducto'); }
        async function registrarProductoUsado() {
            const otId = document.getElementById('otIdProducto').value;
            try {
                await apiFetch(`/ordenes-trabajo/${otId}/productos-usados`, { method: 'POST', body: JSON.stringify({ productoId: parseInt(document.getElementById('productoSelect').value), cantidadUsada: parseInt(document.getElementById('cantidadUsada').value) }) });
                cerrarModal('modalProducto');
                toast('Repuesto registrado y stock descontado', 'success');
                loadOrdenes();
            } catch (e) { toast('Error: ' + e.message, 'danger'); }
        }
        function abrirModalReasignar(otId) { document.getElementById('otIdReasignar').value = otId; abrirModal('modalReasignar'); }
        async function confirmarReasignar() {
            const otId = document.getElementById('otIdReasignar').value;
            const mecId = document.getElementById('reasignarSelect').value;
            if (!mecId) { toast('Elige al nuevo mecánico', 'warning'); return; }
            try {
                await apiFetch(`/ordenes-trabajo/${otId}/mecanico`, { method: 'PUT', body: JSON.stringify({ mecanicoId: parseInt(mecId) }) });
                cerrarModal('modalReasignar');
                toast('OT reasignada', 'success');
                loadOrdenes();
            } catch (e) { toast('Error: ' + e.message, 'danger'); }
        }
        loadData();
        document.querySelectorAll('.ag-modal-overlay').forEach(ov => {
            ov.addEventListener('click', (e) => { if (e.target === ov) ov.classList.remove('show'); });
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') document.querySelectorAll('.ag-modal-overlay.show').forEach(ov => ov.classList.remove('show'));
        });
    </script>
</body>
</html>
