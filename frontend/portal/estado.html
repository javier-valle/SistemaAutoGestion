<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado — Portal del Cliente</title>
<link rel="stylesheet" href="../css/styles.css?v=1">
<style>
:root{--bg:#000;--card:#111;--text:#fff;--text-2:#aaa;--border:rgba(255,255,255,.15);}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:2rem;}
h1{font-size:1.6rem;font-weight:700;margin-bottom:1rem;}
.card{background:linear-gradient(135deg,#1a1a1a 0%,#000 100%);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.card h3{font-size:.9rem;text-transform:uppercase;color:var(--text-2);letter-spacing:.04em;margin-bottom:.5rem;}
</style>
</head>
<body>
<h1>Estado de tu vehículo</h1>
<div class="card"><h3>Última actualización</h3><p>Estado pendiente. Datos protegidos.</p></div>
<div class="card"><h3>Historial</h3><p>Sin registros disponibles para este rango.</p></div>
</body>
</html>
