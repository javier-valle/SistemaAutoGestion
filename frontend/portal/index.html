<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal del Cliente — AutoGestión</title>
<link rel="stylesheet" href="../css/styles.css?v=1">
<link rel="stylesheet" href="../css/polish.css?v=1">
<style>
:root{--bg:#000;--card:#111;--text:#fff;--text-2:#aaa;--border:rgba(255,255,255,.15);--danger:#ff3b3b;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.ag-portal-wrap{width:100%;max-width:480px;background:var(--grad-surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:2.5rem;box-shadow:var(--shadow-xl);}
h1{font-size:2rem;font-weight:700;margin-bottom:.25rem;letter-spacing:-.02em;}
.sub{color:var(--text-2);font-size:.9rem;margin-bottom:1.75rem;}
label{display:block;font-size:.75rem;text-transform:uppercase;color:var(--text-2);letter-spacing:.04em;margin-bottom:.25rem;}
input,select{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);font-family:inherit;font-size:1rem;margin-bottom:1rem;outline:none;transition:border-color .2s;}
input:focus,select:focus{border-color:rgba(255,255,255,.5);}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:.75rem 1.25rem;background:linear-gradient(135deg,#fff 0%,#d0d0d0 100%);color:#000;border:none;border-radius:var(--r-pill);font-weight:700;font-size:.95rem;cursor:pointer;transition:transform .15s ease,box-shadow .2s ease;box-shadow:0 2px 8px rgba(255,255,255,.08);}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,255,255,.15);}
.msg{font-size:.85rem;margin-top:1rem;min-height:1.2rem;}
.msg.error{color:var(--danger);}
.msg.ok{color:#fff;}
.links{margin-top:2rem;font-size:.8rem;color:var(--text-2);display:flex;gap:1rem;justify-content:center;}
.links a{color:var(--text-2);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s;}
.links a:hover{border-bottom-color:var(--text-2);}
</style>
</head>
<body>
<div class="ag-portal-wrap">
  <h1>Portal del Cliente</h1>
  <p class="sub">Consulta tu vehículo. Datos protegidos. <a href="../pages/politicas.html">Políticas</a></p>
  <form id="portalForm" onsubmit="event.preventDefault(); consultar();">
    <label for="doc">Documento (DNI / RUC)</label>
    <input id="doc" type="text" placeholder="Ej. 87654321 o 20123456789" required>
    <label for="tipo">Tipo</label>
    <select id="tipo"><option value="DNI">DNI</option><option value="RUC">RUC</option></select>
    <label for="placa">Placa del vehículo</label>
    <input id="placa" type="text" placeholder="Ej. ABC-123" required>
    <button type="submit" class="btn">Consultar</button>
  </form>
  <div id="msg" class="msg"></div>
  <div class="links">
    <a href="#" onclick="window.open('../pages/politicas.html')">Políticas</a>
    <a href="#" onclick="window.open('../docs/MANUAL_USUARIO.md')">Ayuda</a>
  </div>
</div>
<script src="../js/api.js?v=1"></script>
<script>
async function consultar() {
  const doc = document.getElementById('doc').value.trim();
  const tipo = document.getElementById('tipo').value;
  const placa = document.getElementById('placa').value.trim();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    const res = await apiFetch('/api/public/portal/identificar', { method: 'POST', body: JSON.stringify({ documento: doc, tipoDocumento: tipo, placa }) });
    msg.textContent = 'Identificación correcta.';
    msg.className = 'msg ok';
    localStorage.setItem('portal_token', res.token);
    setTimeout(() => { window.location.href = 'estado.html'; }, 800);
  } catch (e) {
    msg.textContent = 'No encontramos coincidencia con los datos ingresados.';
    msg.className = 'msg error';
  }
}
</script>
</body>
</html>
