<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal del Cliente — AutoGestión</title>
<meta name="description" content="Consulta el estado de tu vehículo, aprueba cotizaciones y descarga comprobantes. Datos protegidos.">
<link rel="stylesheet" href="../css/styles.css?v=2">
<link rel="stylesheet" href="../css/redesign.css?v=2">
<style>
:root{--bg:#000;--card:#111;--text:#fff;--text-2:#a0a0a0;--text-muted:#6b6b6b;--border:rgba(255,255,255,.15);--border-strong:rgba(255,255,255,.50);--danger:#ff3b3b;--grad-surface:linear-gradient(135deg,#1a1a1a 0%,#000 100%);--grad-primary-btn:linear-gradient(135deg,#fff 0%,#d0d0d0 100%);--r-sm:6px;--r-md:10px;--r-lg:16px;--r-xl:24px;--r-pill:999px;--shadow-xl:0 20px 40px rgba(0,0,0,.6);--shadow-glow:0 0 30px rgba(255,255,255,.15);--font-display:'Space Grotesk',sans-serif;--font-body:'Space Grotesk',sans-serif;--font-mono:'DM Mono',ui-monospace,monospace;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem;margin:0;line-height:1.4;}
.ag-portal-wrap{width:100%;max-width:520px;background:var(--grad-surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:var(--sp-6);box-shadow:var(--shadow-xl);backdrop-filter:blur(8px);}
h1{font-family:var(--font-display);font-size:clamp(1.6rem,5vw,2.2rem);font-weight:700;margin-bottom:.25rem;letter-spacing:-.02em;line-height:1.15;color:var(--text);}
.sub{color:var(--text-2);font-size:clamp(.85rem,2vw,.95rem);margin-bottom:var(--sp-5);}
label{display:block;font-size:.75rem;text-transform:uppercase;color:var(--text-2);letter-spacing:.04em;margin-bottom:.35rem;margin-top:var(--sp-4);font-weight:500;}
input,select{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);font-family:inherit;font-size:1rem;margin-bottom:.25rem;outline:none;transition:border-color .2s ease;}
input:focus,select:focus{border-color:var(--border-strong);}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:.85rem 1.25rem;background:var(--grad-primary-btn);color:#000;border:none;border-radius:var(--r-pill);font-weight:700;font-size:.95rem;cursor:pointer;transition:transform .15s ease,box-shadow .2s ease;box-shadow:0 2px 8px rgba(255,255,255,.08);letter-spacing:.01em;}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(255,255,255,.15);}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text);margin-top:.5rem;}
.btn-secondary:hover{border-color:var(--border-strong);}
.msg{font-size:.85rem;margin-top:1rem;min-height:1.4rem;font-family:var(--font-mono);}
.msg.error{color:var(--danger);}
.msg.ok{color:var(--text);}
.links{margin-top:var(--sp-6);font-size:.8rem;color:var(--text-muted);display:flex;gap:var(--sp-4);justify-content:center;flex-wrap:wrap;}
.links a{color:var(--text-2);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s ease;}
.links a:hover{border-bottom-color:var(--text-2);}
.consent-box{margin-top:var(--sp-4);padding:var(--sp-3);border-radius:var(--r-md);border:1px solid var(--border);background:rgba(255,255,255,.02);font-size:.8rem;color:var(--text-2);}
.consent-box label{margin-top:0;text-transform:none;letter-spacing:normal;font-size:.85rem;color:var(--text);font-weight:400;display:flex;align-items:flex-start;gap:.5rem;cursor:pointer;}
.consent-box input[type="checkbox"]{width:auto;margin-bottom:0;accent-color:var(--danger);flex-shrink:0;}
.policy-badge{display:inline-block;padding:.25rem .5rem;border-radius:var(--r-pill);border:1px solid var(--border-strong);font-size:.7rem;color:var(--text-muted);margin-top:.5rem;text-decoration:none;}
</style>
</head>
<body>
<div class="ag-portal-wrap">
  <h1>Portal del Cliente</h1>
  <p class="sub">Consulta tu vehículo, aprueba cotizaciones y descarga comprobantes. Datos protegidos.</p>

  <form id="portalForm" onsubmit="event.preventDefault(); consultar();" aria-label="Identificación del portal">
    <label for="doc">Documento (DNI / RUC) <span aria-label="requerido" style="color:var(--danger);">*</span></label>
    <input id="doc" type="text" placeholder="Ej. 87654321 o 20123456789" required autocomplete="off" aria-required="true">

    <label for="tipo">Tipo de documento</label>
    <select id="tipo" aria-required="true">
      <option value="DNI">DNI</option>
      <option value="RUC">RUC</option>
    </select>

    <label for="placa">Placa del vehículo <span aria-label="requerido" style="color:var(--danger);">*</span></label>
    <input id="placa" type="text" placeholder="Ej. ABC-123" required autocomplete="off" aria-required="true">

    <div class="consent-box">
      <label>
        <input type="checkbox" id="consentimiento" required aria-required="true">
        <span>Acepto las <a href="../pages/politicas.html" target="_blank" rel="noopener">políticas de privacidad</a> y el tratamiento de mis datos. <span style="color:var(--danger);">*</span></span>
      </label>
    </div>

    <button type="submit" class="btn" id="btnConsultar">Consultar (Modo A)</button>
  </form>

  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <div class="links">
    <a href="politicas.html">Políticas</a>
    <a href="#" onclick="solicitarOtp(); return false;">Solicitar código (Modo B)</a>
    <a href="../docs/MANUAL_USUARIO.md" target="_blank">Ayuda</a>
  </div>
</div>

<script src="../js/api.js?v=2"></script>
<script>
async function consultar() {
  const doc = document.getElementById('doc').value.trim();
  const tipo = document.getElementById('tipo').value;
  const placa = document.getElementById('placa').value.trim();
  const consent = document.getElementById('consentimiento').checked;
  const msg = document.getElementById('msg');
  msg.textContent = '';

  if (!consent) {
    msg.textContent = 'Debes aceptar las políticas para continuar.';
    msg.className = 'msg error';
    return;
  }

  try {
    const res = await apiFetch('/api/public/portal/identificar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ documento: doc, tipoDocumento: tipo, placa })
    });
    msg.textContent = 'Identificación correcta. Redirigiendo...';
    msg.className = 'msg ok';
    localStorage.setItem('portal_token', res.token || 'modo-a');
    setTimeout(() => { window.location.href = 'estado.html'; }, 800);
  } catch (e) {
    msg.textContent = 'No encontramos coincidencia con los datos ingresados.';
    msg.className = 'msg error';
  }
}

async function solicitarOtp() {
  const doc = document.getElementById('doc').value.trim();
  const tipo = document.getElementById('tipo').value;
  const msg = document.getElementById('msg');
  msg.textContent = '';

  if (!doc) {
    msg.textContent = 'Ingresa el documento para solicitar el código.';
    msg.className = 'msg error';
    return;
  }

  try {
    await apiFetch('/api/public/portal/otp/solicitar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ documento: doc, tipoDocumento: tipo })
    });
    msg.textContent = 'Si hay coincidencia, recibirás el código por el canal registrado.';
    msg.className = 'msg ok';
  } catch (e) {
    msg.textContent = 'No encontramos coincidencia con los datos ingresados.';
    msg.className = 'msg error';
  }
}
</script>
</body>
</html>
