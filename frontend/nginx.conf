# Limite para el portal publico (identificacion y OTP): frena fuerza bruta.
limit_req_zone $binary_remote_addr zone=portal_zone:10m rate=20r/m;
# Consulta de documento: limite propio (evita enumerar RUC/DNI).
limit_req_zone $binary_remote_addr zone=portal_doc_zone:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver de Docker: si el backend reinicia, Nginx no se cae.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # ---------- API ----------
    # Portal del cliente (publico): con limite de intentos.
    location /api/public/ {
        limit_req zone=portal_zone burst=10 nodelay;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Consulta de documento: limite propio contra enumeracion.
    location /api/public/portal/documento/consultar {
        limit_req zone=portal_doc_zone burst=5 nodelay;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API del personal y del portal autenticado.
    location /api/ {
        client_max_body_size 10m;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Web ----------
    # Personal (login + paneles). No indexar.
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # Cliente (raiz = portal).
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Favicon: sin log, cache largo.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 0;
        add_header Cache-Control "no-cache";
    }
}
