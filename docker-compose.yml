services:

  db:
    build: ./database
    container_name: autogestion_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autogestion}
      POSTGRES_USER: ${POSTGRES_USER:-autogestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autogestion2024}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autogestion} -d ${POSTGRES_DB:-autogestion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: autogestion_frontend
    ports:
      # 5501 por defecto: el 5500 puede estar ocupado por otro servicio del equipo
      - "${FRONTEND_PORT:-5501}:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: autogestion_backend
    ports:
      - "127.0.0.1:8080:8080"   # solo local (depuracion); el navegador entra por Nginx
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-autogestion}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-autogestion}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-autogestion2024}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-cambialo-en-produccion-0123456789abcdef}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@sanmartin.pe}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-Admin-2026*}
      APP_SEED_PASSWORD_MECANICO: ${APP_SEED_PASSWORD_MECANICO:-Meca-2026*}
      APP_SEED_PASSWORD_ALMACEN: ${APP_SEED_PASSWORD_ALMACEN:-Alma-2026*}
      APP_SEED_PASSWORD_RECEPCIONISTA: ${APP_SEED_PASSWORD_RECEPCIONISTA:-Recep-2026*}
      PADRON_RUC_ARCHIVO: ${PADRON_RUC_ARCHIVO:-/padron/padron_reducido_ruc.zip}
      PADRON_RUC_SOLO_ACTIVOS: ${PADRON_RUC_SOLO_ACTIVOS:-false}
      PADRON_RUC_IMPORTAR_AL_INICIAR: ${PADRON_RUC_IMPORTAR_AL_INICIAR:-false}
      RENIEC_DNI_TOKEN: ${RENIEC_DNI_TOKEN:-}
      RENIEC_DNI_URL: ${RENIEC_DNI_URL:-https://api.decolecta.com/v1/reniec/dni}
      RENIEC_DNI_REQUIERE_TOKEN: ${RENIEC_DNI_REQUIERE_TOKEN:-true}
      RENIEC_CONSULTA_MAX: ${RENIEC_CONSULTA_MAX:-12}
      RENIEC_CONSULTA_VENTANA_MIN: ${RENIEC_CONSULTA_VENTANA_MIN:-10}
      SCRALL_API_KEY: ${SCRALL_API_KEY:-}
      SCRALL_DNI_URL: ${SCRALL_DNI_URL:-https://api.scrall.net/v1/reniec/basico}
      SCRALL_DNI_TIMEOUT_MS: ${SCRALL_DNI_TIMEOUT_MS:-4000}
      DNIPERU_DNI_HABILITADO: ${DNIPERU_DNI_HABILITADO:-true}
      DNIPERU_DNI_BASE_URL: ${DNIPERU_DNI_BASE_URL:-https://dniperu.com}
      DNIPERU_DNI_TIMEOUT_MS: ${DNIPERU_DNI_TIMEOUT_MS:-8000}
      OPENRUC_RUC_HABILITADO: ${OPENRUC_RUC_HABILITADO:-true}
      OPENRUC_RUC_URL: ${OPENRUC_RUC_URL:-https://openruc.com/api/ruc}
      OPENRUC_RUC_TIMEOUT_MS: ${OPENRUC_RUC_TIMEOUT_MS:-8000}
      APP_EMPRESA_WHATSAPP: ${APP_EMPRESA_WHATSAPP:-}
    volumes:
      - ./padron:/padron:ro   # opcional: deja aquí padron_reducido_ruc.zip descargado de SUNAT
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
