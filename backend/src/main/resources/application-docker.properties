# PostgreSQL configuration for Docker environment
spring.datasource.url=jdbc:postgresql://db:5432/autogestion
spring.datasource.username=autogestion
spring.datasource.password=autogestion2024
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 console
spring.h2.console.enabled=false

# Flyway es el unico dueno del esquema: en volumenes existentes hace
# baseline de V1 y aplica solo lo pendiente (V2...); en volumen nuevo migra todo.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# JWT y arranque: todo sale de variables de entorno (ver .env.example).
# Sin valores reales aquí a propósito: nada secreto vive en el repo.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# Consola H2 apagada fuera de desarrollo
app.h2-console=false

# Demo solo si APP_SEED_DEMO=true; el ADMIN de arranque siempre se crea
app.seed-demo=${APP_SEED_DEMO:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@sanmartin.pe}
app.admin.password=${APP_ADMIN_PASSWORD}
app.seed.password.mecanico=${APP_SEED_PASSWORD_MECANICO}
app.seed.password.almacen=${APP_SEED_PASSWORD_ALMACEN}
app.seed.password.recepcionista=${APP_SEED_PASSWORD_RECEPCIONISTA}

# Emisor (reemplazables por variables de entorno en produccion)
app.empresa.ruc=${APP_EMPRESA_RUC:20123456786}
app.empresa.razon-social=${APP_EMPRESA_RAZON_SOCIAL:TALLER SAN MARTIN S.A.C.}
app.empresa.nombre-comercial=${APP_EMPRESA_NOMBRE_COMERCIAL:Taller San Mart\u00EDn}
app.empresa.direccion=${APP_EMPRESA_DIRECCION:Av. Universitaria 123, San Martin de Porres, Lima}
app.empresa.ubigeo=${APP_EMPRESA_UBIGEO:150135}
app.empresa.telefono=${APP_EMPRESA_TELEFONO:01-555-0135}
app.empresa.email=${APP_EMPRESA_EMAIL:facturacion@sanmartin.pe}
app.empresa.whatsapp=${APP_EMPRESA_WHATSAPP:}
app.empresa.igv=${APP_EMPRESA_IGV:0.18}
app.empresa.precios-incluyen-igv=${APP_EMPRESA_PRECIOS_INCLUYEN_IGV:true}
app.empresa.boleta-umbral-dni=${APP_EMPRESA_BOLETA_UMBRAL_DNI:700.00}

# Consulta de RUC con datos públicos (Padrón Reducido SUNAT cargado en la BD). Sin API key.
padron.ruc.archivo=${PADRON_RUC_ARCHIVO:/padron/padron_reducido_ruc.zip}
padron.ruc.url=${PADRON_RUC_URL:https://www2.sunat.gob.pe/padron_reducido_ruc.zip}
padron.ruc.solo-activos=${PADRON_RUC_SOLO_ACTIVOS:false}
padron.ruc.importar-al-iniciar=${PADRON_RUC_IMPORTAR_AL_INICIAR:false}

server.port=8080

# Consulta de DNI: RENIEC no ofrece API pública gratuita. El endpoint debe ser un
# proveedor autorizado (normalmente con token). Sin token queda en modo manual.
reniec.dni.url=${RENIEC_DNI_URL:https://api.decolecta.com/v1/reniec/dni}
reniec.dni.token=${RENIEC_DNI_TOKEN:}
reniec.dni.timeout-ms=${RENIEC_DNI_TIMEOUT_MS:4000}
reniec.dni.requiere-token=${RENIEC_DNI_REQUIERE_TOKEN:true}
reniec.dni.fuente=${RENIEC_DNI_FUENTE:RENIEC v\u00EDa proveedor externo}
reniec.consulta.max-por-ventana=${RENIEC_CONSULTA_MAX:12}
reniec.consulta.ventana-minutos=${RENIEC_CONSULTA_VENTANA_MIN:10}

# DNI sin RUC 10: Scrall (tercero, plan API Básico gratuito). Sin clave queda deshabilitado.
scrall.dni.url=${SCRALL_DNI_URL:https://api.scrall.net/v1/reniec/basico}
scrall.dni.token=${SCRALL_API_KEY:}
scrall.dni.timeout-ms=${SCRALL_DNI_TIMEOUT_MS:4000}

# Fuentes gratuitas (sin token) para el portal de registro.
# DNI: dniperu.com (tercero no oficial). Su sitio no manda CORS; por eso se consulta
# desde el backend y no desde el navegador.
dniperu.dni.habilitado=${DNIPERU_DNI_HABILITADO:true}
dniperu.dni.base-url=${DNIPERU_DNI_BASE_URL:https://dniperu.com}
dniperu.dni.timeout-ms=${DNIPERU_DNI_TIMEOUT_MS:8000}
# RUC: openruc.com (API publica sin clave). Complementa al Padron Reducido RUC.
openruc.ruc.habilitado=${OPENRUC_RUC_HABILITADO:true}
openruc.ruc.url=${OPENRUC_RUC_URL:https://openruc.com/api/ruc}
openruc.ruc.timeout-ms=${OPENRUC_RUC_TIMEOUT_MS:8000}
