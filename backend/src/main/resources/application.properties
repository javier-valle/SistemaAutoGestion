
spring.datasource.url=jdbc:h2:mem:autogestion;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=never
# Flyway es el unico dueno del esquema (H2 en memoria: migra desde cero en cada arranque).
# Misma carpeta que en docker: el SQL es compatible con ambas (H2 en modo PostgreSQL).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=dev-only-h2-local-cambialo-en-produccion-0123456789abcdef
app.jwt.expiration-ms=86400000

# Solo desarrollo (H2 local). En docker va en false.
app.h2-console=true

# Datos de demostración en H2 (en docker los gobierna APP_SEED_DEMO)
app.seed-demo=true
