app.empresa.direccion=Av. Universitaria 123, San Martin de Porres, Lima
app.empresa.ubigeo=150135
app.empresa.telefono=01-555-0135
app.empresa.email=facturacion@sanmartin.pe
# WhatsApp de atencion (vacio = el portal no muestra ese canal).
app.empresa.whatsapp=${APP_EMPRESA_WHATSAPP:}
